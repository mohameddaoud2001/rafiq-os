[project]
name = "rafiq-os"
version = "0.1.0"
description = "Rafiq OS - الرَّفِيق المُسْنِد - PoC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.2",
    "langchain-mcp-adapters>=0.1",
    "httpx>=0.27",
    "pypdf>=4.0",
    "respx>=0.21",
    "rank-bm25>=0.2.2",
]

[project.scripts]
rafiq = "rafiq.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rafiq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
